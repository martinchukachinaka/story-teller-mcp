# Learning scaffold: comments explain each concept; trim them once they feel obvious.

name: Docs Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-sync.yml'
  # Adds a "Run workflow" button in the Actions tab, handy while iterating.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List pages without sending them to Confluence'
        type: boolean
        default: true

# One sync at a time: a second run waits, so two runs never race to bump the same page version.
concurrency:
  group: docs-sync
  cancel-in-progress: false

# A workflow is made of jobs; each job runs on a fresh virtual machine (a "runner").
jobs:
  sync:
    runs-on: ubuntu-latest
    # The default is 6 hours; a stuck run should fail fast instead of holding the concurrency group.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show what triggered this run
        run: |
          echo "Event:  ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Inputs only exist on manual runs; on a push this prints empty, which counts as false.
          echo "Dry run: ${{ inputs.dry_run }}"

      - name: List docs to sync
        run: find docs -name '*.md' -print

      - name: About this push
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: echo "$EVENT_JSON"

      - name: Check Confluence credentials
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_SPACE_ID: ${{ vars.CONFLUENCE_SPACE_ID }}
        run: |
          curl -s --fail-with-body -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            "$CONFLUENCE_BASE_URL/wiki/api/v2/spaces/$CONFLUENCE_SPACE_ID" | jq '{id, key, name}'

      # Pins Node and caches downloaded npm packages between runs, keyed on the lockfile.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # `npm ci` installs exactly what package-lock.json lists, which is what you want in CI.
      - name: Install sync dependencies
        run: npm ci
        working-directory: scripts

      - name: Sync docs to Confluence
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_SPACE_ID: ${{ vars.CONFLUENCE_SPACE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/sync-docs.mjs
